<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comic Chat Thread Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --panel-w: 320px;
    --panel-h: 280px;
  }
  body {
    font-family: "Comic Sans MS", "Comic Neue", cursive;
    background: #c0c0c0;
    margin: 0;
  }
  header {
    background: #000080;
    color: white;
    padding: 6px 12px;
    font-size: 14px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  header input {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 3px 6px;
    border: 2px inset #fff;
  }
  header button {
    font-family: inherit;
    font-size: 13px;
    padding: 3px 10px;
  }
  #status { padding: 8px 12px; font-size: 13px; }
  #strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, var(--panel-w));
    justify-content: center;
    gap: 0;
    background: white;
    margin: 12px;
    border: 1px solid black;
  }
  .panel {
    position: relative;
    height: var(--panel-h);
    border: 1px solid black;
    overflow: hidden;
  }
  .scene {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center bottom;
  }
  .char {
    position: absolute;
    bottom: 0;
    height: 58%;
    transform: translateX(-50%);
    image-rendering: auto;
  }
  .char img { height: 100%; }
  .char.flip img { transform: scaleX(-1); }
  .balloon {
    position: absolute;
    box-sizing: border-box;
    padding: 5px 8px;
    font-size: 11px;
    line-height: 15px;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .balloon.whisper { font-style: italic; }
  .balloon img {
    display: block;
    margin: 2px auto 0;
    border: 1px solid black;
    filter: grayscale(1) contrast(1.05);
  }
  .shapes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .tails {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .narration {
    position: absolute;
    box-sizing: border-box;
    left: 4px;
    width: calc(100% - 8px);
    background: white;
    border: 1px solid black;
    padding: 2px 6px;
    font-size: 10px;
    line-height: 13px;
    white-space: pre-line;
  }
  .title-panel {
    box-sizing: border-box;
    padding: 14px 12px;
    background: white;
    text-align: center;
  }
  .title-panel h1 {
    font-size: 22px;
    letter-spacing: 1px;
    margin: 4px 0 2px;
  }
  .title-panel .sub {
    font-size: 11px;
    margin-bottom: 8px;
  }
  .title-panel .star {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    margin: 3px 0 3px 12px;
    text-align: left;
  }
  .title-panel .star img.cast-icon {
    width: 28px;
    height: 28px;
    border: 1px solid black;
  }
  img.emoji {
    height: 11px;
    vertical-align: -2px;
  }
  #preview {
    position: fixed;
    display: none;
    max-width: 60vw;
    max-height: 60vh;
    border: 2px solid black;
    background: white;
    padding: 3px;
    z-index: 100;
    pointer-events: none;
  }
  .nametag {
    position: absolute;
    bottom: 2px;
    transform: translateX(-50%);
    font-size: 10px;
    background: rgba(255,255,255,.85);
    border: 1px solid black;
    padding: 0 4px;
    max-width: 30%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header>
  <b>Comic Chat</b>
  <input id="url" placeholder="https://lain.com/notice/...">
  <button id="go">View</button>
</header>
<div id="status"></div>
<div id="strip"></div>

<script>
const ASSETS = 'assets/chars/';
const NEUTRAL = 9; // emotion code for the wheel's center
let manifest;

// ---------- data ----------

function parseNoticeUrl(u) {
  const m = u.trim().match(/^https?:\/\/([^/]+)\/(?:notice|objects)\/([A-Za-z0-9]+)/);
  if (!m) throw new Error('Expected a URL like https://instance/notice/<id>');
  return { host: m[1], id: m[2] };
}

async function api(host, path) {
  const r = await fetch(`https://${host}/api/v1/${path}`);
  if (!r.ok) throw new Error(`API ${path}: HTTP ${r.status}`);
  return r.json();
}

// Fetch the whole thread: walk up to the root, then take the root's descendants.
async function fetchThread(host, id) {
  const ctx = await api(host, `statuses/${id}/context`);
  const rootId = ctx.ancestors.length ? ctx.ancestors[0].id : id;
  if (rootId === id) {
    const root = await api(host, `statuses/${id}`);
    return [root, ...ctx.descendants];
  }
  const root = ctx.ancestors[0];
  const rootCtx = await api(host, `statuses/${rootId}/context`);
  return [root, ...rootCtx.descendants];
}

// ---------- comic mapping ----------

function hash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h;
}

// Deterministically assign one of the 22 characters per account, avoiding
// collisions until the cast is exhausted.
function makeCast(statuses) {
  const cast = new Map();
  const taken = new Set();
  for (const st of statuses) {
    const acct = st.account.acct;
    if (cast.has(acct)) continue;
    let i = hash(acct) % manifest.characters.length;
    for (let n = 0; n < manifest.characters.length && taken.has(i); n++)
      i = (i + 1) % manifest.characters.length;
    taken.add(i);
    cast.set(acct, manifest.characters[i]);
  }
  return cast;
}

function plainText(st) {
  const doc = new DOMParser().parseFromString(st.content, 'text/html');
  // Drop leading @mentions, Comic Chat speech shouldn't start with handles.
  for (const a of doc.querySelectorAll('a.mention, span.h-card')) {
    const prev = a.previousSibling;
    if (!prev || !prev.textContent.trim()) a.remove(); else break;
  }
  let text = doc.body.textContent.replace(/\s+/g, ' ').trim();
  // Images render inside the balloon; other attachments get a marker.
  if (st.media_attachments.some(a => a.type !== 'image'))
    text += ' [attachment]';
  if (text.length > 290) text = text.slice(0, 287) + '…';
  return text.trim();
}

// Floating full-size preview for balloon pictures, shown on hover. Lives on
// <body> so it isn't clipped by the panel.
let previewEl = null;
function bindPreview(img, media) {
  if (!previewEl) {
    previewEl = document.createElement('img');
    previewEl.id = 'preview';
    document.body.appendChild(previewEl);
  }
  img.addEventListener('mousemove', e => {
    previewEl.src = media.full;
    previewEl.style.display = 'block';
    previewEl.style.left =
      Math.max(4, Math.min(e.clientX + 14,
        innerWidth - previewEl.offsetWidth - 8)) + 'px';
    previewEl.style.top =
      Math.max(4, Math.min(e.clientY + 14,
        innerHeight - previewEl.offsetHeight - 8)) + 'px';
  });
  img.addEventListener('mouseleave', () => {
    previewEl.style.display = 'none';
  });
}

// Display name with :shortcode: custom emoji replaced by inline images
// (resolved against the account's emojis list).
function nameFrag(account) {
  const frag = document.createDocumentFragment();
  const name = account.display_name || account.acct;
  const emojis = account.emojis || [];
  const re = /:([\w-]+):/g;
  let last = 0, m;
  while ((m = re.exec(name))) {
    const e = emojis.find(e => e.shortcode === m[1]);
    if (!e) continue;
    frag.append(name.slice(last, m.index));
    const img = document.createElement('img');
    img.className = 'emoji';
    img.src = e.static_url || e.url;
    img.alt = m[0];
    frag.append(img);
    last = m.index + m[0].length;
  }
  frag.append(name.slice(last));
  return frag;
}

// ---------- rendering ----------

function el(tag, cls, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  parent && parent.appendChild(e);
  return e;
}

// Pick a pose via the character's emotion map: entries matching the wanted
// code, else neutral; `seed` breaks ties between same-emotion variants.
function pickPose(character, code, intensity, seed) {
  let entries = character.map.filter(e => e.code === code);
  if (!entries.length) entries = character.map.filter(e => e.code === NEUTRAL);
  if (!entries.length) entries = character.map;
  entries.sort((a, b) => Math.abs(a.intensity - intensity) -
                         Math.abs(b.intensity - intensity));
  const best = entries.filter(e => e.intensity === entries[0].intensity);
  return character.poses[best[(seed >>> 0) % best.length].pose];
}

// Emotion wheel codes, identified by inspecting the standard characters'
// expressions: 1 happy, 2 coy, 3 bored, 4 scared, 5 sad, 6 angry,
// 7 shouting, 8 laughing, 9 neutral.
const EMOTION_RULES = [
  [8, /\b(lo+l\w*|lmao+|rofl|a?ha(ha)+|hehe+|kek\w*|jaja(ja)*)\b|😂|🤣|:D|x[dD]\b/],
  [7, /(^|\s)[A-Z'!?.]{4,}(\s|$)|!{2,}/],
  [6, /\b(angry|furious|wtf|fuck\w*|shit|hate|goddamn|damn\w*|grr+)\b|>:\(|😠|😡|🖕/i],
  [4, /\b(scared|afraid|terrified|yikes|eek|spooky|creepy|horror)\b|😱|😨|D:/i],
  [5, /\b(sad|sigh|alas|cry\w*|crying|sorry|rip|miss (you|him|her))\b|:'?\(|☹|😢|😭/i],
  [2, /;[)3]|😉|😏|\b(secret\w*|tease|wink|sneak\w*)\b|~$/i],
  [3, /\b(bored|boring|meh|whatever|eh|zzz+|yawn)\b|🥱|🙄|shrug/i],
  [1, /\b(nice|cool|great|good|love\w*|awesome|thanks|thank you|happy|yay|congrats)\b|:[)3]|😊|❤|♥/i],
];

// Gesture codes live on bodies: 10 wave, 11 point at other, 12 point at
// self, 14 open arms. Text cues from the paper (§4.1).
const GESTURE_RULES = [
  [10, /^(hi+|hiya|hello+|hey+|yo|bye+|goodbye|cya|see ya|welcome|greetings|o\/)\b|\bbrb\b/i],
  [12, /^(i|i'm|i'll|i'd|i've|imho|imo)\b/i],
  [11, /^(you|you're|you'll|are you|will you|did you|do you|don't you|u)\b/i],
];

// Stand-in for Comic Chat's text analysis: keyword/emoticon rules pick the
// wheel emotion, sentence-start cues pick gestures. A strong (exclaimed)
// emotion beats a gesture; a gesture beats a calm emotion (the paper found
// gestures read better in comics than subtle expressions). Bare "!" shouts,
// a trailing "?" gets the shrug.
function emotionFor(text) {
  const emo = EMOTION_RULES.find(([, re]) => re.test(text));
  const loud = /!/.test(text);
  if (emo && loud) return { code: emo[0], intensity: 0xff };
  const gest = GESTURE_RULES.find(([, re]) => re.test(text));
  if (gest) return { code: gest[0], intensity: 0xff };
  if (emo) return { code: emo[0], intensity: 0x99 };
  if (/!$/.test(text)) return { code: 7, intensity: 0x99 };
  if (/\?$/.test(text)) return { code: 3, intensity: 0x66 };
  return { code: NEUTRAL, intensity: 0 };
}

// Character goes in the (zoomable) scene; the nametag stays on the panel at
// the character's zoomed position.
function addChar(scene, panel, character, pose, xPct, flip, account, z) {
  const c = el('div', 'char' + (flip ? ' flip' : ''), scene);
  c.style.left = xPct + '%';
  const img = el('img', null, c);
  img.src = `${ASSETS}${character.dir}/${pose.file}`;
  img.alt = character.name;
  const tag = el('div', 'nametag', panel);
  tag.style.left = (50 + (xPct - 50) * z) + '%';
  tag.appendChild(nameFrag(account));
}

// ---------- panel arrangement (paper §4.3) ----------
// An arrangement is an ordered list of {acct, facing}. The art faces right
// by default, so facing 'left' means mirrored.

const faces = (arr, ai, bi) =>
  bi < ai ? arr[ai].facing === 'left' : arr[ai].facing === 'right';

// The paper's evaluation function: Facing penalties over ordered pairs,
// plus Neighbors penalties against the previous panel's arrangement.
// addrMap: speaker acct -> addressee acct (or null) for this panel.
function panelCost(arr, addrMap, prevNeighbors) {
  let cost = 0;
  for (let ai = 0; ai < arr.length; ai++) {
    for (let bi = 0; bi < arr.length; bi++) {
      if (ai === bi) continue;
      const target = addrMap.get(arr[ai].acct);
      if (!target) {
        if (!faces(arr, ai, bi)) cost += 4;
        if (!faces(arr, bi, ai)) cost += 2;
      } else if (arr[bi].acct === target) {
        if (!faces(arr, bi, ai)) cost += 4;
        if (!faces(arr, ai, bi)) cost += 40;
        cost += 4 * (Math.abs(ai - bi) - 1);
      }
    }
  }
  arr.forEach((m, k) => {
    const prev = prevNeighbors.get(m.acct);
    if (!prev) return;
    if ((k > 0 ? arr[k - 1].acct : null) !== prev.left) cost += 1;
    if ((k < arr.length - 1 ? arr[k + 1].acct : null) !== prev.right) cost += 1;
  });
  return cost;
}

// Greedy placement: insert each character at the position/orientation that
// minimizes the running cost (paper §4.3).
function arrange(members, addrMap, prevNeighbors) {
  let arr = [];
  for (const acct of members) {
    let best = null;
    for (let p = 0; p <= arr.length; p++) {
      for (const facing of ['right', 'left']) {
        const cand = [...arr.slice(0, p), { acct, facing }, ...arr.slice(p)];
        const c = panelCost(cand, addrMap, prevNeighbors);
        if (!best || c < best.c) best = { cand, c };
      }
    }
    arr = best.cand;
  }
  return arr;
}

// ---------- balloon layout (paper §5.2) ----------

const PANEL_W = 320, PANEL_H = 280;
const CHAR_H = Math.round(0.58 * PANEL_H);
const BALLOON_ZONE = PANEL_H - CHAR_H - 8; // balloons live above the heads
const LINE_H = 15, PAD_X = 8, PAD_Y = 5;
const TAIL_T = 16; // routing channel corridor width

const measurer = document.createElement('canvas').getContext('2d');
measurer.font = '11px "Comic Sans MS", "Comic Neue", cursive';

// Woodring-style balloon outline (§5.3): a rounded box whose long edges get
// small low-frequency waves, deterministic per balloon. Shout balloons
// (§5.1) get a jagged outline instead -- the type the original never shipped.
function balloonPath(x0, y0, w, h, seed, type) {
  const r = 8, step = 13;
  const edges = [
    [x0 + r, y0, x0 + w - r, y0, 0, -1],
    [x0 + w, y0 + r, x0 + w, y0 + h - r, 1, 0],
    [x0 + w - r, y0 + h, x0 + r, y0 + h, 0, 1],
    [x0, y0 + h - r, x0, y0 + r, -1, 0],
  ];
  const pts = [];
  let i = seed % 5;
  for (const [x1, y1, x2, y2, nx, ny] of edges) {
    const nseg = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step));
    for (let s = 0; s <= nseg; s++, i++) {
      const fx = x1 + (x2 - x1) * s / nseg;
      const fy = y1 + (y2 - y1) * s / nseg;
      const off = (s === 0 || s === nseg) ? 0
        : type === 'shout' ? (i % 2 ? 7 : -3)
        : 1.3 * Math.sin(i * 1.1 + seed % 7) + 0.8 * Math.sin(i * .37 + seed % 13);
      pts.push((fx + nx * off).toFixed(1) + ',' + (fy + ny * off).toFixed(1));
    }
  }
  return 'M' + pts.join('L') + 'Z';
}

function wrapLines(text, innerW) {
  // Break words wider than the balloon (URLs) into fitting chunks first.
  const words = text.split(/\s+/).flatMap(w => {
    const out = [];
    while (measurer.measureText(w).width > innerW && w.length > 1) {
      let cut = w.length - 1;
      while (cut > 1 && measurer.measureText(w.slice(0, cut)).width > innerW)
        cut--;
      out.push(w.slice(0, cut));
      w = w.slice(cut);
    }
    out.push(w);
    return out;
  });
  const lines = [];
  let cur = '';
  for (const word of words) {
    const t = cur ? cur + ' ' + word : word;
    if (!cur || measurer.measureText(t).width <= innerW) cur = t;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines;
}

// Semantic backgrounds (§6.3): topical keywords swap the scene for one
// panel. The five Woodring backgrounds map to rough moods.
const SEMANTIC_BGS = [
  ['volcano', /\b(fire|burn\w*|flame\w*|hell|war|gulag|explo\w*|rage|destroy\w*)\b/i],
  ['den', /\b(home|cozy|comfy|couch|sleep\w*|bed|tired|night)\b/i],
  ['field', /\b(outside|nature|walk|hik\w*|sunny|weather|park|grass)\b/i],
  ['pastoral', /\b(peace\w*|calm|chill\w*|relax\w*|zen|serene)\b/i],
];

function semanticBg(texts) {
  for (const [name, re] of SEMANTIC_BGS) {
    if (texts.some(t => re.test(t)))
      return manifest.backgrounds.find(b => b.name === name);
  }
  return null;
}

// PlaceBalloons with routing channels: each balloon keeps a clear vertical
// corridor for its tail; later balloons' channels are trimmed so earlier
// corridors survive (MaxAllowable), and placing a balloon shrinks earlier
// channels away from its extent (ReduceChannel). Returns null if a balloon
// can't be placed (panel break), unless `relax` (single-utterance panels).
function layoutBalloons(utts, relax, yStart = 0) {
  const placed = [];
  const channels = [];
  for (const u of utts) {
    // Comic lettering is all-caps (§5.5); measure what will be displayed.
    const text = u.text.toUpperCase();
    const lineW = measurer.measureText(text).width + 2 * PAD_X + 4;
    const maxW = PANEL_W - 12;
    const minWordW = Math.min(maxW, 2 * PAD_X + 6 + Math.max(
      ...text.split(/\s+/).map(w => measurer.measureText(w).width)));
    let w = Math.min(lineW, maxW);
    if (u.media) w = Math.min(maxW, Math.max(w, 110));
    if (lineW > maxW) {
      // Multi-line: width from text area over allowable height (paper),
      // with a seeded nudge standing in for the paper's randomness.
      const bottom = placed.length ? Math.max(...placed.map(p => p.b)) : 0;
      const allowH = Math.max(LINE_H, BALLOON_ZONE - bottom - 4);
      const area = lineW * LINE_H * 4 / 3;
      w = Math.max(minWordW, Math.min(maxW, area / allowH));
      w = Math.min(maxW, w + (u.seed % 40));
    }

    // Routing channel: widest extent passing over the speaker's face.
    const ch = {
      l: Math.max(6, u.faceX - w),
      r: Math.min(PANEL_W - 6, u.faceX + w),
    };
    channels.forEach((c, k) => {
      const xi = utts[k].faceX;
      if (xi < u.faceX) ch.l = Math.max(ch.l, xi + TAIL_T / 2);
      else ch.r = Math.min(ch.r, xi - TAIL_T / 2);
    });
    if (ch.r - ch.l < minWordW) {
      if (!relax) return null;
      ch.l = 6; ch.r = PANEL_W - 6;
    }
    w = Math.min(w, ch.r - ch.l);

    const lines = text ? wrapLines(text, w - 2 * PAD_X - 2) : [];
    let imgW = 0, imgH = 0;
    if (u.media) {
      imgH = 64;
      imgW = imgH * u.media.ar;
      const availW = w - 2 * PAD_X - 2;
      if (imgW > availW) { imgW = availW; imgH = imgW / u.media.ar; }
    }
    const h = lines.length * LINE_H + 2 * PAD_Y + 2
      + (imgH ? imgH + (lines.length ? 4 : 0) + 2 : 0);
    const l = Math.min(Math.max(u.faceX - w / 2, ch.l), ch.r - w);

    // Vertical: as high as possible, but reading order requires staying
    // below the bottom of balloons to the right, and no higher than the
    // top of balloons to the left; never overlap an earlier balloon.
    let t = yStart + 4;
    for (const p of placed) {
      const overlap = p.l < l + w && l < p.l + p.w;
      if (p.l + p.w / 2 > l + w / 2 || overlap) t = Math.max(t, p.b + 4);
      else t = Math.max(t, p.t);
    }
    if (t + h > BALLOON_ZONE + yStart + (relax ? 60 : 16)) return null;

    placed.push({ l, t, w, h, b: t + h, lines, imgW, imgH,
                  tailX: Math.min(Math.max(u.faceX, l + 10), l + w - 12) });
    channels.forEach((c, k) => {
      if (utts[k].faceX < u.faceX) c.r = Math.min(c.r, l);
      else c.l = Math.max(c.l, l + w);
    });
    channels.push(ch);
  }
  return placed;
}

// Who is this post talking to? First mention that's a thread participant,
// else the previous distinct speaker.
function addresseeOf(st, statuses, i, participants) {
  const m = (st.mentions || []).find(
    x => participants.has(x.acct) && x.acct !== st.account.acct);
  if (m) return m.acct;
  for (let j = i - 1; j >= 0; j--) {
    if (statuses[j].account.acct !== st.account.acct)
      return statuses[j].account.acct;
  }
  return null;
}

function render(statuses, title) {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  const cast = makeCast(statuses);
  const bg = manifest.backgrounds[hash(statuses[0].id) % manifest.backgrounds.length];

  // Title panel with the most active participants (paper Fig. 7).
  {
    const tp = el('div', 'panel title-panel', strip);
    el('div', 'sub', tp).textContent = title || 'a comic chat';
    el('h1', null, tp).textContent = 'COMIC CHAT';
    el('div', 'sub', tp).textContent = 'STARRING';
    const counts = new Map();
    statuses.forEach(s =>
      counts.set(s.account.acct, (counts.get(s.account.acct) || 0) + 1));
    [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5)
      .forEach(([acct]) => {
        const row = el('div', 'star', tp);
        const ch = cast.get(acct);
        if (ch.icon) {
          const img = el('img', 'cast-icon', row);
          img.src = `${ASSETS}${ch.dir}/${ch.icon}`;
        }
        const who = statuses.find(s => s.account.acct === acct).account;
        const span = el('span', null, row);
        span.appendChild(nameFrag(who));
        span.append(` as ${ch.name}`);
      });
  }

  const participants = new Set(statuses.map(s => s.account.acct));
  const names = new Map(statuses.map(s => [s.account.acct, s.account]));
  const prevNeighbors = new Map();

  const utts = statuses.map((st, i) => {
    const text = plainText(st);
    const emo = emotionFor(text);
    const img = st.media_attachments.find(a => a.type === 'image');
    const dims = img && (img.meta?.original || img.meta?.small);
    return {
      acct: st.account.acct, text, emo,
      media: img ? {
        url: img.preview_url || img.url,
        full: img.url || img.preview_url,
        ar: dims && dims.width && dims.height ? dims.width / dims.height : 4 / 3,
      } : null,
      cw: st.spoiler_text || null,
      seed: hash(st.id),
      addressee: addresseeOf(st, statuses, i, participants),
      // Balloon vocabulary (§5.1): non-public posts whisper, *actions*
      // think, shouting emotion shouts.
      type: st.visibility === 'private' || st.visibility === 'direct'
        ? 'whisper'
        : /^\*[^*]+\*$/.test(text) ? 'thought'
        : emo.code === 7 ? 'shout' : 'speech',
    };
  });

  // Arrangement + balloon layout for one panel's utterances; null = no fit.
  function tryLayout(us) {
    const members = [];
    for (const u of us) {
      if (!members.includes(u.acct)) members.push(u.acct);
      if (u.addressee && !members.includes(u.addressee))
        members.push(u.addressee);
    }
    if (members.length > 4) return null;
    const addrMap = new Map(us.map(u => [u.acct, u.addressee]));
    const arr = arrange(members, addrMap, prevNeighbors);
    const xs = new Map(arr.map(
      (m, k) => [m.acct, (k + 0.5) * PANEL_W / arr.length]));
    // Content warnings become narration boxes at the top of the panel;
    // balloons go below them (paper §8).
    const narrations = [];
    let yStart = 0;
    for (const u of us) {
      if (!u.cw) continue;
      const lines = wrapLines(('CW: ' + u.cw).toUpperCase(), PANEL_W - 24);
      const h = lines.length * 13 + 6;
      narrations.push({ t: yStart + 3, h, lines });
      yStart += h + 5;
    }
    const balloons = layoutBalloons(
      us.map(u => ({ ...u, faceX: xs.get(u.acct) })), us.length === 1, yStart);
    return balloons && { arr, balloons, narrations };
  }

  // Panel breaks (§6.1): same speaker again, a 5th character, balloons not
  // fitting, or (15%) right after a longer opening utterance.
  const panels = [];
  let cur = null;
  const commit = () => {
    if (!cur) return;
    cur.layout.arr.forEach((m, k, a) => prevNeighbors.set(m.acct, {
      left: k > 0 ? a[k - 1].acct : null,
      right: k < a.length - 1 ? a[k + 1].acct : null,
    }));
  };
  for (const u of utts) {
    if (cur && !cur.closed && !cur.utts.some(p => p.acct === u.acct)) {
      const layout = tryLayout([...cur.utts, u]);
      if (layout) {
        cur.utts.push(u);
        cur.layout = layout;
        continue;
      }
    }
    commit();
    cur = {
      utts: [u],
      layout: tryLayout([u]),
      closed: u.text.split(' ').length > 6 && u.seed % 100 < 15,
    };
    panels.push(cur);
  }
  commit();

  panels.forEach((p, pi) => {
    const panel = el('div', 'panel', strip);
    const scene = el('div', 'scene', panel);
    const pbg = semanticBg(p.utts.map(u => u.text)) || bg;
    scene.style.backgroundImage = `url(${ASSETS}${pbg.file})`;
    const { arr, balloons, narrations } = p.layout;

    // Camera zoom (§6.2): pull in as far as the shot allows -- outermost
    // characters must stay in frame, nobody gets cut at the neck (z<=2 keeps
    // the cut at the waist) or at the ankles (skip the 1.05-1.3 band).
    // Establishing shot for the first panel and every ~15th.
    const n = arr.length;
    const zFrame = n > 1
      ? (PANEL_W / 2 - 38) / (PANEL_W / 2 - PANEL_W / (2 * n)) : 2;
    let z = [1, 1.45, 1.7, 1.95][p.utts[0].seed % 4];
    z = Math.max(1, Math.min(z, zFrame, 2));
    if (z > 1.05 && z < 1.3) z = 1.3;
    if (pi % 15 === 0) z = 1;
    const charTop = PANEL_H - CHAR_H;
    scene.style.transform = `scale(${z})`;
    scene.style.transformOrigin = `50% ${charTop}px`;

    arr.forEach((m, k) => {
      const ch = cast.get(m.acct);
      const u = p.utts.find(x => x.acct === m.acct);
      const pose = u
        ? pickPose(ch, u.emo.code, u.emo.intensity, u.seed)
        : pickPose(ch, NEUTRAL, 0, (p.utts[0].seed ^ hash(m.acct)) >>> 0);
      addChar(scene, panel, ch, pose, (k + 0.5) * 100 / arr.length,
              m.facing === 'left', names.get(m.acct), z);
    });

    const ns = 'http://www.w3.org/2000/svg';
    const mksvg = cls => {
      const s = document.createElementNS(ns, 'svg');
      s.setAttribute('class', cls);
      s.setAttribute('viewBox', `0 0 ${PANEL_W} ${PANEL_H}`);
      return s;
    };
    const shapes = mksvg('shapes'); // balloon bodies, under the text divs
    panel.appendChild(shapes);
    const svg = mksvg('tails');     // tails, over everything

    for (const nb of narrations) {
      const div = el('div', 'narration', panel);
      div.style.top = nb.t + 'px';
      div.style.height = nb.h + 'px';
      div.textContent = nb.lines.join('\n');
    }

    p.utts.forEach((u, j) => {
      const b = balloons[j];
      const body = document.createElementNS(ns, 'path');
      body.setAttribute('d', balloonPath(b.l, b.t, b.w, b.h, u.seed, u.type));
      body.setAttribute('fill', 'white');
      body.setAttribute('stroke', 'black');
      if (u.type === 'whisper') body.setAttribute('stroke-dasharray', '4 3');
      shapes.appendChild(body);

      const div = el('div',
        'balloon' + (u.type === 'whisper' ? ' whisper' : ''), panel);
      div.style.left = b.l + 'px';
      div.style.top = b.t + 'px';
      div.style.width = b.w + 'px';
      div.style.height = b.h + 'px';
      div.textContent = b.lines.join('\n');
      if (u.media && b.imgH) {
        const im = el('img', null, div);
        im.src = u.media.url;
        im.width = Math.round(b.imgW);
        im.height = Math.round(b.imgH);
        im.loading = 'lazy';
        bindPreview(im, u.media);
      }

      const k = arr.findIndex(m => m.acct === u.acct);
      const fx = (k + 0.5) * PANEL_W / arr.length;
      const faceX = PANEL_W / 2 + (fx - PANEL_W / 2) * z;
      const faceY = charTop + 14 * z;
      if (u.type === 'thought') {
        [0.25, 0.55, 0.82].forEach((f, q) => {
          const c = document.createElementNS(ns, 'circle');
          c.setAttribute('cx', b.tailX + (faceX - b.tailX) * f);
          c.setAttribute('cy', b.b - 2 + (faceY - b.b + 2) * f);
          c.setAttribute('r', 4.5 - q * 1.4);
          c.setAttribute('fill', 'white');
          c.setAttribute('stroke', 'black');
          svg.appendChild(c);
        });
      } else {
        const tail = document.createElementNS(ns, 'polygon');
        tail.setAttribute('points',
          `${b.tailX - 6},${b.b - 2} ${b.tailX + 8},${b.b - 2} ${faceX},${faceY}`);
        tail.setAttribute('fill', 'white');
        tail.setAttribute('stroke', 'black');
        if (u.type === 'whisper') tail.setAttribute('stroke-dasharray', '4 3');
        svg.appendChild(tail);
        const gap = document.createElementNS(ns, 'line');
        gap.setAttribute('x1', b.tailX - 5); gap.setAttribute('y1', b.b - 2);
        gap.setAttribute('x2', b.tailX + 7); gap.setAttribute('y2', b.b - 2);
        gap.setAttribute('stroke', 'white'); gap.setAttribute('stroke-width', 3);
        svg.appendChild(gap);
      }
    });
    panel.appendChild(svg);
  });
}

].map(([who, text, vis, cw, media], i) => ({

    emojis: who === 'carol'
      ? [{ shortcode: 'flag', url: 'assets/chars/anna/icon.png' }] : [],
  },
  content: text, media_attachments: media ? [media] : [],
  visibility: vis || 'public', spoiler_text: cw || '',
}));

async function view(url) {
  const status = document.getElementById('status');
  try {
    status.textContent = 'Loading…';
    if (url.trim() === 'test') {
      render(FIXTURE, 'test fixture presents');
      status.textContent = 'test fixture';
      return;
    }
    const { host, id } = parseNoticeUrl(url);
    const statuses = await fetchThread(host, id);
    render(statuses, `${host} presents`);
    status.textContent = `${statuses.length} posts, ` +
      `${new Set(statuses.map(s => s.account.acct)).size} participants`;
    history.replaceState(null, '', '#' + encodeURIComponent(url));
  } catch (e) {
    status.textContent = e.message;
  }
}

document.getElementById('go').onclick = () =>
  view(document.getElementById('url').value);
document.getElementById('url').addEventListener('keydown', e => {
  if (e.key === 'Enter') view(e.target.value);
});

    : 'https://lain.com/notice/B7DYQJk0qO1wZnEi4O';
  document.getElementById('url').value = initial;
  view(initial);
})();
