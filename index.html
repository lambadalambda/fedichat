<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comic Chat Thread Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --panel-w: 320px;
    --panel-h: 280px;
  }
  body {
    font-family: "Comic Sans MS", "Comic Neue", cursive;
    background: #c0c0c0;
    margin: 0;
  }
  header {
    background: #000080;
    color: white;
    padding: 6px 12px;
    font-size: 14px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  header input {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 3px 6px;
    border: 2px inset #fff;
  }
  header button {
    font-family: inherit;
    font-size: 13px;
    padding: 3px 10px;
  }
  #status { padding: 8px 12px; font-size: 13px; }
  #strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, var(--panel-w));
    justify-content: center;
    gap: 0;
    background: white;
    margin: 12px;
    border: 1px solid black;
  }
  .panel {
    position: relative;
    height: var(--panel-h);
    border: 1px solid black;
    overflow: hidden;
  }
  .scene {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center bottom;
  }
  .char {
    position: absolute;
    bottom: 0;
    height: 58%;
    transform: translateX(-50%);
    image-rendering: auto;
  }
  .char img { height: 100%; }
  .char.flip img { transform: scaleX(-1); }
  .balloon {
    position: absolute;
    box-sizing: border-box;
    padding: 5px 8px;
    font-size: 11px;
    line-height: 15px;
    white-space: pre-line;
    overflow-wrap: break-word;
  }
  .balloon.whisper { font-style: italic; }
  .balloon a {
    color: inherit;
    text-decoration: underline;
  }
  .balloon .attachrow {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: 2px;
  }
  .balloon .att { position: relative; }
  .balloon .att.video::after {
    content: '▶';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: white;
    text-shadow: 0 0 4px black;
    pointer-events: none;
  }
  .balloon img.attach {
    display: block;
    border: 1px solid black;
    filter: grayscale(1) contrast(1.05);
  }
  .balloon img.attach.sens {
    filter: grayscale(1) blur(8px);
    cursor: pointer;
  }
  .balloon img.attach.sens.revealed {
    filter: grayscale(1) contrast(1.05);
  }
  .balloon img.bemoji {
    height: 13px;
    vertical-align: -2px;
  }
  .shapes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .tails {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .narration {
    position: absolute;
    box-sizing: border-box;
    left: 4px;
    width: calc(100% - 8px);
    background: white;
    border: 1px solid black;
    padding: 2px 6px;
    font-size: 10px;
    line-height: 13px;
    white-space: pre-line;
  }
  .title-panel {
    box-sizing: border-box;
    padding: 14px 12px;
    background: white;
    text-align: center;
  }
  .title-panel h1 {
    font-size: 22px;
    letter-spacing: 1px;
    margin: 4px 0 2px;
  }
  .title-panel .sub {
    font-size: 11px;
    margin-bottom: 8px;
  }
  .title-panel .star {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    margin: 3px 0 3px 12px;
    text-align: left;
  }
  .title-panel .star img.cast-icon {
    width: 28px;
    height: 28px;
    border: 1px solid black;
  }
  img.emoji {
    height: 11px;
    vertical-align: -2px;
  }
  #preview {
    position: fixed;
    display: none;
    max-width: 60vw;
    max-height: 60vh;
    border: 2px solid black;
    background: white;
    padding: 3px;
    z-index: 100;
    pointer-events: none;
  }
  .nametag {
    position: absolute;
    bottom: 2px;
    transform: translateX(-50%);
    font-size: 10px;
    background: rgba(255,255,255,.85);
    border: 1px solid black;
    padding: 0 4px;
    max-width: 30%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<header>
  <b>Comic Chat</b>
  <input id="url" placeholder="https://lain.com/notice/...">
  <button id="go">View</button>
  <button id="save" disabled>Save PNG</button>
  <a href="client.html" style="color:white; font-size:12px">timelines</a>
</header>
<div id="status"></div>
<div id="strip"></div>

<script type="module">
import { parseStatusUrl } from './comic.js';
import { ensureManifest } from './panel.js';
import { fetchThread, renderStrip, renderCanvas, downloadPNG } from './strip.js';

let lastModel = null;

// ---------- main ----------

// Dev fixture: type "test" instead of a URL.
const FIXTURE = [
  ['alice', 'hi everyone'],
  ['bob', 'you must be new here'],
  ['alice', "I think this place is great"],
  ['carol', 'WHAT IS GOING ON'],
  ['bob', 'lol calm down'],
  ['carol', 'sorry :('],
  ['alice', 'psst this is a secret', 'direct'],
  ['bob', '*wonders what they are plotting*'],
  ['carol', 'this whole thread should burn in hell'],
  ['alice', 'anyway here are my cat pics', 'public', 'cat pictures'],
  ['bob', 'behold my fursona', 'public', null,
   { type: 'image', preview_url: 'assets/chars/xeno/pose00.png',
     meta: { original: { width: 312, height: 322 } } }],
  ['carol', '', 'public', null,
   { type: 'image', preview_url: 'assets/chars/anna/pose06.png',
     meta: { original: { width: 175, height: 441 } } }],
  ['bob', 'big mood :flag: honestly :flag: same', 'public', null, null,
   [{ shortcode: 'flag', url: 'assets/chars/anna/icon.png' }]],
  ['carol', 'comic chat is open source now ' +
   '<a href="https://github.com/microsoft/comic-chat">' +
   '<span>github.com/</span>microsoft/comic-…</a> can you believe it'],
  ['alice', 'double feature', 'public', null,
   [{ type: 'image', preview_url: 'assets/chars/anna/pose00.png',
      meta: { original: { width: 200, height: 300 } } },
    { type: 'video', preview_url: 'assets/chars/xeno/pose03.png',
      meta: { original: { width: 300, height: 200 } } }]],
  ['bob', 'cursed image do not open', 'public', null,
   [{ type: 'image', preview_url: 'assets/chars/tiki/pose00.png',
      meta: { original: { width: 250, height: 300 } } }], null, true],
  ['alice', 'and now for my extremely long manifesto about comic chat: ' +
   'the panels must flow, the balloons must wave, the characters must ' +
   'emote, and the reader must never get lost on the way through the ' +
   'strip. this is the way of woodring and kurlander and salesin, as it ' +
   'was in 1996, as it shall be on the fediverse, forever and ever, ' +
   'panel after panel, balloon after balloon, until the timeline itself ' +
   'runs out of posts to render.'],
].map(([who, text, vis, cw, media, emojis, sensitive], i) => ({
  id: 'fx' + i,
  account: {
    acct: who,
    display_name: who === 'carol' ? 'Denpa mode :flag: carol' : who,
    emojis: who === 'carol'
      ? [{ shortcode: 'flag', url: 'assets/chars/anna/icon.png' }] : [],
  },
  content: text,
  media_attachments: media ? (Array.isArray(media) ? media : [media]) : [],
  visibility: vis || 'public', spoiler_text: cw || '',
  emojis: emojis || [], sensitive: !!sensitive,
}));

async function view(url) {
  const status = document.getElementById('status');
  const strip = document.getElementById('strip');
  try {
    status.textContent = 'Loading…';
    if (url.trim() === 'test') {
      lastModel = await renderStrip(strip, FIXTURE, 'test fixture presents');
      document.getElementById('save').disabled = false;
      status.textContent = 'test fixture';
      return;
    }
    const { host, id } = parseStatusUrl(url);
    const { statuses, truncated } = await fetchThread(host, id);
    lastModel = await renderStrip(strip, statuses, `${host} presents`);
    document.getElementById('save').disabled = false;
    status.textContent = `${statuses.length} posts, ` +
      `${new Set(statuses.map(s => s.account.acct)).size} participants` +
      (truncated ? ' (thread may be truncated by the instance)' : '');
    history.replaceState(null, '', '#' + encodeURIComponent(url));
  } catch (e) {
    status.textContent = e.message;
  }
}

async function exportPNG() {
  if (!lastModel) return;
  const btn = document.getElementById('save');
  btn.disabled = true;
  try {
    await downloadPNG(lastModel);
  } catch (e) {
    document.getElementById('status').textContent = 'Export failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('save').onclick = exportPNG;
// Hook for tests/automation (module scope is unreachable from the console).
window.fedichat = { renderCanvas: () => renderCanvas(lastModel) };

document.getElementById('go').onclick = () =>
  view(document.getElementById('url').value);
window.addEventListener('hashchange', () => {
  const u = decodeURIComponent(location.hash.slice(1));
  document.getElementById('url').value = u;
  view(u);
});
document.getElementById('url').addEventListener('keydown', e => {
  if (e.key === 'Enter') view(e.target.value);
});

(async () => {
  await ensureManifest();
  const initial = location.hash
    ? decodeURIComponent(location.hash.slice(1))
    : 'https://lain.com/notice/B7DYQJk0qO1wZnEi4O';
  document.getElementById('url').value = initial;
  view(initial);
})();
</script>
</body>
</html>
